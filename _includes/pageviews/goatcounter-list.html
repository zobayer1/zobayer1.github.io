<!--
  Display GoatCounter pageviews on post-list cards.

  Local addition (no upstream counterpart). The theme only ships
  `_includes/pageviews/goatcounter.html`, which targets the single `#pageviews`
  element on a post page; this handles the many cards on a list page.

  Counts come from the Worker in `worker/` via `pageviews/counts-store.html`,
  which returns every path in one response — so this is a single request no
  matter how many cards are on the page, and none at all on a repeat visit.

  Each card stays hidden until its count arrives, so a slow or unavailable
  counter degrades to the card simply not showing a view count — no spinners, no
  misleading fallback number.
-->
{% include pageviews/counts-store.html %}

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const items = document.querySelectorAll('#post-list .pv-count[data-pv-path]');

    if (items.length === 0) {
      return;
    }

    const formatter = new Intl.NumberFormat();

    window.pvCounts
      .then((counts) => {
        items.forEach((item) => {
          /* The Worker keys paths the way GoatCounter stores them: trailing
             slash trimmed. A path with no views is absent from the map. */
          const count = counts[item.dataset.pvPath.replace(/\/$/, '')];

          if (count === undefined) {
            return;
          }

          item.innerText = formatter.format(count);
          item.classList.remove('d-none');

          /* The eye icon is a sibling, not a wrapper — see the note in _layouts/home.html. */
          const icon = item.previousElementSibling;

          if (icon) {
            icon.classList.remove('d-none');
          }
        });
      })
      .catch(() => {
        /* Leave the counts hidden. */
      });
  });
</script>
